<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Retira — Annuity & Retirement Income Planning</title>
  <meta name="description"
    content="Sign in to your Retira client portal to view retirement income streams, annuity contracts, and advisor communication.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Centered Clean Auth Layout */
    .auth-page-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 60px 20px;
      position: relative;
      background: var(--cream);
    }

    .auth-card-clean {
      width: min(440px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 38px 32px;
      box-shadow: var(--shadow);
    }

    /* Floating Top Controls */
    .top-controls {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    [dir="rtl"] .top-controls {
      right: auto;
      left: 18px;
    }

    @media (max-width: 600px) {
      .top-controls {
        top: 10px;
        right: 10px;
      }

      [dir="rtl"] .top-controls {
        right: auto;
        left: 10px;
      }

      .auth-page-wrapper {
        padding: 54px 10px 20px;
      }

      .auth-card-clean {
        padding: 28px 18px;
      }
    }

    /* Password Wrap & Toggle */
    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrap input {
      padding-right: 46px;
    }

    [dir="rtl"] .password-wrap input {
      padding-right: 14px;
      padding-left: 46px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.15rem;
      color: var(--muted);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
      user-select: none;
    }

    [dir="rtl"] .password-toggle {
      right: auto;
      left: 12px;
    }

    .password-toggle:hover {
      color: var(--green);
    }

    /* Social Divider & OAuth Buttons */
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0 16px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--line);
    }

    .auth-divider:not(:empty)::before {
      margin-right: .75em;
    }

    .auth-divider:not(:empty)::after {
      margin-left: .75em;
    }

    .social-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-social:hover {
      border-color: var(--green);
      background: var(--sage);
      transform: translateY(-1px);
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(45, 114, 91, 0.08);
      border: 1px solid rgba(45, 114, 91, 0.18);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--green);
      margin-top: 22px;
    }

    /* Toast Notification */
    .toast-notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: var(--ink);
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [dir="rtl"] .toast-notification {
      right: auto;
      left: 24px;
    }

    .toast-notification.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- Floating Top Controls -->
  <div class="top-controls">
    <button type="button" class="theme-toggle-btn" data-action="toggle-theme" title="Toggle Light/Dark Theme"
      aria-label="Toggle Theme">🌙</button>
    <button type="button" class="rtl-toggle-btn" data-action="toggle-rtl" title="Toggle RTL Layout"
      aria-label="Toggle RTL">RTL</button>
  </div>

  <div class="auth-page-wrapper">
    <div class="auth-card-clean">
      <div style="text-align: center; margin-bottom: 24px;">
        <a class="brand" href="index.html" style="justify-content: center; font-size: 1.4rem; margin-bottom: 12px;">
          <span class="brand-mark">R</span>Retira
        </a>
        <div class="eyebrow" style="margin-bottom: 4px;">CLIENT PORTAL</div>
        <h1 style="font-size: 2.1rem; margin-bottom: 6px;">Welcome back.</h1>
        <p class="lead" style="font-size: 0.95rem; margin: 0 auto; max-width: 360px;">Sign in to continue to your
          retirement planning experience.</p>
      </div>

      <form data-redirect="dashboard.html" id="loginForm">
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="password-wrap">
            <input type="password" id="loginPassword" placeholder="Enter password" required>
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('loginPassword', this)"
              aria-label="Toggle password visibility">👁️</button>
          </div>
          <div style="text-align: right; margin-top: 8px;">
            <a href="#" onclick="triggerForgotPassword(event)"
              style="font-size: 0.84rem; color: var(--green); font-weight: 700;">Forgot password?</a>
          </div>
        </div>

        <button class="btn btn-primary form-submit" type="submit"
          style="width: 100%; padding: 13px; font-size: 1rem; margin-top: 16px;">Sign In</button>
      </form>

      <p style="text-align: center; font-size: 0.92rem; color: var(--muted); margin-top: 16px;">
        New to Retira? <a href="signup.html" style="color: var(--green); font-weight: 700;">Create a client account</a>
      </p>

      <div class="security-badge">
        🔒 256-Bit SSL Encrypted & Bank-Grade Security
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast" class="toast-notification"></div>

  <script src="script.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        input.type = "password";
        btn.textContent = "👁️";
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    function triggerForgotPassword(e) {
      e.preventDefault();
      showToast("🔒 Password reset link has been sent to your email address.");
    }

    function handleSocialAuth(provider) {
      showToast("Connecting securely via " + provider + " OAuth...");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1200);
    }
  </script>
</body>

</html>
