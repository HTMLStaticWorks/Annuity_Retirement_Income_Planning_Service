<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Retira — Annuity & Retirement Income Planning</title>
  <meta name="description"
    content="Sign in to your Retira client portal to view retirement income streams, annuity contracts, and advisor communication.">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Centered Clean Auth Layout */
    .auth-page-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 60px 20px;
      position: relative;
      background: var(--cream);
    }

    .auth-card-clean {
      width: min(440px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 38px 32px;
      box-shadow: var(--shadow);
    }

    /* Floating Top Controls */
    .top-controls {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    [dir="rtl"] .top-controls {
      right: auto;
      left: 28px;
    }

    /* Password Wrap & Toggle */
    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrap input {
      padding-right: 46px;
    }

    [dir="rtl"] .password-wrap input {
      padding-right: 14px;
      padding-left: 46px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.15rem;
      color: var(--muted);
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s ease;
      user-select: none;
    }

    [dir="rtl"] .password-toggle {
      right: auto;
      left: 12px;
    }

    .password-toggle:hover {
      color: var(--green);
    }

    /* Social Divider & OAuth Buttons */
    .auth-divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 22px 0 16px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--line);
    }

    .auth-divider:not(:empty)::before {
      margin-right: .75em;
    }

    .auth-divider:not(:empty)::after {
      margin-left: .75em;
    }

    .social-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .btn-social {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      color: var(--ink);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-social:hover {
      border-color: var(--green);
      background: var(--sage);
      transform: translateY(-1px);
    }

    .security-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(45, 114, 91, 0.08);
      border: 1px solid rgba(45, 114, 91, 0.18);
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--green);
      margin-top: 22px;
    }

    /* Toast Notification */
    .toast-notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: var(--ink);
      color: white;
      padding: 14px 22px;
      border-radius: 14px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [dir="rtl"] .toast-notification {
      right: auto;
      left: 24px;
    }

    .toast-notification.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- Floating Top Controls -->
  <div class="top-controls">
    <button type="button" class="theme-toggle-btn" data-action="toggle-theme" title="Toggle Light/Dark Theme"
      aria-label="Toggle Theme">🌙</button>
    <button type="button" class="rtl-toggle-btn" data-action="toggle-rtl" title="Toggle RTL Layout"
      aria-label="Toggle RTL">RTL</button>
  </div>

  <div class="auth-page-wrapper">
    <div class="auth-card-clean">
      <div style="text-align: center; margin-bottom: 24px;">
        <a class="brand" href="index.html" style="justify-content: center; font-size: 1.4rem; margin-bottom: 12px;">
          <span class="brand-mark">R</span>Retira
        </a>
        <div class="eyebrow" style="margin-bottom: 4px;">CLIENT PORTAL</div>
        <h1 style="font-size: 2.1rem; margin-bottom: 6px;">Welcome back.</h1>
        <p class="lead" style="font-size: 0.95rem; margin: 0 auto; max-width: 360px;">Sign in to continue to your
          retirement planning experience.</p>
      </div>

      <form data-redirect="dashboard.html" id="loginForm">
        <div class="field">
          <label for="loginEmail">Email address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required value="alex.vance@example.com">
        </div>

        <div class="field">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px;">
            <label for="loginPassword" style="margin-bottom: 0;">Password</label>
            <a href="#" onclick="triggerForgotPassword(event)"
              style="font-size: 0.84rem; color: var(--green); font-weight: 700;">Forgot password?</a>
          </div>
          <div class="password-wrap">
            <input type="password" id="loginPassword" placeholder="Enter password" required value="••••••••••••">
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('loginPassword', this)"
              aria-label="Toggle password visibility">👁️</button>
          </div>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin: 16px 0 22px;">
          <label
            style="display: flex; align-items: center; gap: 8px; font-size: 0.88rem; color: var(--muted); cursor: pointer; user-select: none;">
            <input type="checkbox" checked style="accent-color: var(--green); width: 16px; height: 16px;"> Remember this
            device
          </label>
        </div>

        <button class="btn btn-primary form-submit" type="submit"
          style="width: 100%; padding: 13px; font-size: 1rem;">Sign in to Dashboard →</button>
      </form>

      <div class="auth-divider">Or continue with</div>

      <div class="social-buttons">
        <button type="button" class="btn-social" onclick="handleSocialAuth('Google')">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#EA4335"
              d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z" />
            <path fill="#4285F4"
              d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z" />
            <path fill="#FBBC05"
              d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9c-.2-.7-.4-1.5-.4-2.3z" />
            <path fill="#34A853"
              d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z" />
          </svg> Google
        </button>
        <button type="button" class="btn-social" onclick="handleSocialAuth('Apple')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.35c.66-.8 1.11-1.92.99-3.04-.96.04-2.13.64-2.82 1.44-.61.71-1.15 1.86-1.01 2.96 1.08.08 2.18-.55 2.84-1.36z" />
          </svg> Apple
        </button>
        <button type="button" class="btn-social" onclick="handleSocialAuth('Facebook')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
          </svg> Facebook
        </button>
      </div>

      <p style="text-align: center; font-size: 0.92rem; color: var(--muted); margin-top: 16px;">
        New to Retira? <a href="signup.html" style="color: var(--green); font-weight: 700;">Create a client account</a>
      </p>

      <div class="security-badge">
        🔒 256-Bit SSL Encrypted & Bank-Grade Security
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast" class="toast-notification"></div>

  <script src="script.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        input.type = "password";
        btn.textContent = "👁️";
      }
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3500);
    }

    function triggerForgotPassword(e) {
      e.preventDefault();
      showToast("🔒 Password reset link has been sent to your email address.");
    }

    function handleSocialAuth(provider) {
      showToast("Connecting securely via " + provider + " OAuth...");
      setTimeout(() => {
        window.location.href = "dashboard.html";
      }, 1200);
    }
  </script>
</body>

</html>
